<meta charset="utf-8"><div class="available-content"><div dir="auto" class="body markup"><h2 class="header-anchor-post">The quiet year<div class="pencraft pc-display-flex pc-alignItems-center pc-position-absolute pc-reset header-anchor-parent"><div class="pencraft pc-display-contents pc-reset pubTheme-yiXxQA"><div id="§the-quiet-year" class="pencraft pc-reset header-anchor offset-top"></div><button tabindex="0" type="button" aria-label="Link" class="pencraft pc-reset pencraft icon-container restack-image"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3"></path></svg></button></div></div></h2><p>It was the year we <strong>stopped</strong> counting, and <em>started</em> noticing. I wrote about it <a href="https://example.substack.com/p/earlier-post" rel="">here</a>.<a class="footnote-anchor" data-component-name="FootnoteAnchorToDOM" id="footnote-anchor-1" href="#footnote-1" target="_self">1</a></p><blockquote><p>Noticing is a slow kind of kindness.</p></blockquote><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" target="_blank" href="https://substackcdn.com/image/fetch/f_auto,q_auto:good/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fabc.jpeg" data-component-name="Image2ToDOM"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/w_424,c_limit,f_webp/abc.jpeg 424w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/w_1456,c_limit,f_auto/abc.jpeg" width="1456" height="971" data-attrs="{&quot;src&quot;:&quot;https://substack-post-media.s3.amazonaws.com/public/images/abc.jpeg&quot;}" class="sizing-normal" alt="A quiet street at dusk" title="A quiet street at dusk" srcset="https://substackcdn.com/image/fetch/w_424/abc.jpeg 424w" sizes="100vw" fetchpriority="high"></picture><div class="image-link-expand"><div class="pencraft pc-display-flex pc-gap-8 pc-reset"><button tabindex="0" type="button" class="pencraft pc-reset pencraft icon-container restack-image"><svg role="img" width="20" height="20"><g><title></title><path d="M2.53 7.81"></path></g></svg></button></div></div></div></a><figcaption class="image-caption">The street where it started.</figcaption></figure></div><ul><li><p>Walk more.</p></li><li><p>Read slowly.</p><ul><li><p>Paper books.</p></li></ul></li></ul><p class="button-wrapper" data-attrs="{&quot;url&quot;:&quot;https://example.substack.com/subscribe&quot;,&quot;text&quot;:&quot;Subscribe now&quot;}" data-component-name="ButtonCreateButton"><a class="button primary" href="https://example.substack.com/subscribe"><span>Subscribe now</span></a></p><div class="footnote" data-component-name="FootnoteToDOM"><a id="footnote-1" href="#footnote-anchor-1" class="footnote-number" contenteditable="false" target="_self">1</a><div class="footnote-content"><p>Mostly in the mornings.</p></div></div></div></div>
